<!doctype html>
<html lang="en" data-runtime="browser">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAMS Workbench</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=26233652cd1b3dd2">
    <link rel="stylesheet" href="./style.css?v=26233652cd1b3dd2" />
    <link rel="stylesheet" href="./unified/engineering-view.css?v=26233652cd1b3dd2" />
    <script type="module" src="./app.js?v=26233652cd1b3dd2"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to workspace</a>
    <header>
      <strong class="brand"><img class="brand-mark" src="./logo.svg?v=26233652cd1b3dd2" width="30" height="30" alt="">RAMS Workbench</strong
      ><label class="sr-only" for="projects">Project</label
      ><select id="projects">
        <option value="">Select a project</option></select
      ><span id="revision"></span>
      <div class="header-actions">
        <a class="guide-link" href="./guide/" target="_blank" rel="noopener" aria-label="User guide (opens in a new tab)">User guide</a>
        <details class="project-menu">
          <summary>Project menu</summary>
          <div>
            <button id="export">Download study</button>
            <button id="reload">Reload project</button>
            <button id="applicationStatus">Application status</button>
            <hr>
            <button id="exportArchive">Download full archive</button>
            <button id="backupWorkspace">Back up workspace</button>
            <button id="restoreWorkspace">Restore workspace backup</button>
            <button id="previousWorkspace">Download previous workspace</button>
            <input id="restoreFile" type="file" accept=".sqlite3,.db,application/vnd.sqlite3" hidden>
            <a class="button" href="./guide/#1-open-the-workbench-and-protect-your-work" target="_blank" rel="noopener">Browser storage & recovery help</a>
            <hr>
            <button id="create">New project</button>
            <button data-import-project>Import project</button>
            <input id="import" type="file" accept=".json,application/json" hidden>
            <details class="example-menu"><summary>Example studies</summary><button id="completeExample">Complete station study</button><button id="crossrailExample">Crossrail-informed ventilation study</button><button id="example">Basic station example</button><button id="methodExample">Bow tie & fault tree example</button></details>
          </div>
        </details>
      </div>
    </header>
    <div id="notice" role="status" aria-live="polite"></div>
    <div class="shell">
      <button id="toggleNavigation" class="nav-toggle" aria-expanded="false" aria-controls="studyNavigation">Study navigation</button>
      <div class="study-navigation" id="studyNavigation">
        <nav class="app-nav" aria-label="Study">
          <button data-view="overview" data-work-area="study">Study</button>
          <button data-view="hazards" data-work-area="safety">Safety</button>
          <button data-view="ram" data-work-area="reliability">Reliability</button>
          <button data-view="evidence" data-work-area="verification">Verification</button>
          <button data-view="review" data-work-area="review">Review &amp; report</button>
          <div class="nav-utilities">
            <button data-library>Record library</button>
            <button data-view="practice">Method reference</button>
          </div>
        </nav>
        <details class="scope-menu">
          <summary id="scopeLabel">Scope: all systems</summary>
          <aside class="scope">
            <div class="section-head"><h2>System scope</h2><button id="addItem">Add item</button></div>
            <button id="allScope" class="scope-all">All systems</button>
            <div id="tree"></div><div id="scopeNote" class="scope-note"></div>
          </aside>
        </details>
      </div>
      <main id="main" tabindex="-1">
        <div id="workAreaContext" class="work-area-context" hidden>
          <label for="workspaceView">View</label><select id="workspaceView" aria-label="Workspace view"></select>
        </div>
        <section id="workspace">
          <div id="content"><p role="status">Opening workspace…</p><noscript><p>Enable JavaScript to open the workspace.</p></noscript></div>
          <section id="inspector" aria-label="Selected record"></section>
          <aside id="reviewDock" aria-label="Record workspace" hidden><div id="reviewDetail"></div><div id="reviewEditorSlot"></div></aside>
        </section>
        <footer>
          <span id="studyMode">Local workspace</span>
          <span id="appVersion"></span>
          <a href="https://haitaowu12.github.io/tony-wu-home/">Tony Wu · More projects</a>
        </footer>
      </main>
    </div>
    <dialog id="recordContext" aria-labelledby="contextTitle">
      <div class="context-header"><h2 id="contextTitle">Related record</h2><button id="closeContext">Return to workspace</button></div>
      <nav id="contextTrail" aria-label="Related record path"></nav>
      <div id="contextRecord"></div>
    </dialog>
    <dialog id="editor" aria-labelledby="editorTitle">
      <form id="entityForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow" id="editorType"></p>
            <h2 id="editorTitle">Record</h2>
          </div>
          <button type="button" id="closeEditor">Close</button>
        </div>
        <div id="entityFields"></div>
        <p id="entityError" class="error" role="alert"></p>
        <div class="form-actions">
          <button type="button" id="cancelEditor">Cancel</button
          ><button class="primary">Save record</button>
        </div>
      </form>
    </dialog>
    <dialog id="actionDialog" aria-labelledby="actionTitle">
      <form id="actionForm">
        <div class="dialog-head">
          <h2 id="actionTitle"></h2>
          <button type="button" id="closeAction">Close</button>
        </div>
        <div id="actionFields"></div>
        <p id="actionError" class="error" role="alert"></p>
        <div class="form-actions">
          <button class="primary" id="actionSubmit">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
