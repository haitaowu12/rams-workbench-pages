:root {
  font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: #252c29;
  background: #f7f7f3;
  --ink: #252c29;
  --muted: #626962;
  --line: #d9ddd5;
  --soft: #f1f2ec;
  --canvas: #f7f7f3;
  --paper: #fff;
  --graphite: #252b28;
  --teal: #9b4f26;
  --copper: #9b4f26;
  --copper-soft: #f7ede5;
  --amber: #866218;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
button, input, select, textarea { font: inherit; }
button, .button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid #b5bbb1; border-radius: 3px; padding: 8px 12px;
  min-height: 36px; background: #fff; color: var(--ink); cursor: pointer;
  line-height: 1.35; text-align: left; text-decoration: none;
  transition: background-color 100ms ease, border-color 100ms ease, transform 100ms ease;
}
button:hover, .button:hover { background: var(--soft); border-color: #8b9387; }
button:active, .button:active { transform: translateY(1px); background: #e6e8df; }
button.primary, .button.primary { background: var(--copper); border-color: var(--copper); color: #fff; font-weight: 600; }
button.primary:hover, .button.primary:hover { background: #80401f; border-color: #80401f; }
button:disabled { opacity: .45; cursor: default; transform: none; }
button.link { display: inline; min-height: 0; border: 0; border-radius: 0; background: none; padding: 0; color: var(--copper); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
a { color: var(--copper); text-underline-offset: 3px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
input, select, textarea { width: 100%; min-width: 0; border: 1px solid #949e90; border-radius: 3px; background: #fff; padding: 9px 10px; color: var(--ink); }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--copper); }
input:read-only, textarea:read-only { background: var(--soft); }
textarea { resize: vertical; min-height: 100px; line-height: 1.55; }
label { display: block; font-weight: 600; font-size: 13px; }
label > input, label > select, label > textarea { display: block; margin-top: 6px; font-weight: 400; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 27px; font-weight: 600; letter-spacing: -.6px; line-height: 1.2; }
h2 { font-size: 19px; font-weight: 600; letter-spacing: -.25px; line-height: 1.35; }
h3, h4 { font-size: 14px; font-weight: 600; line-height: 1.45; }
p { margin: 8px 0; line-height: 1.6; }
h1, h2, h3, td, .record-row, .read-only { overflow-wrap: anywhere; }
small { font-size: 12px; }
hr { border: 0; border-top: 1px solid var(--line); }
.muted { color: var(--muted); font-size: 13px; }
.error { color: #a2352d; }
.eyebrow { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 7px; }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Persistent study map and compact project chrome. */
body > header { height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 24px 0 18px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.brand { display: flex; align-items: center; gap: 9px; width: 158px; flex-shrink: 0; font-size: 15px; line-height: 1.2; font-weight: 600; letter-spacing: -.25px; }
.brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 26px; color: var(--copper); }
.brand-mark svg { width: 22px; height: 26px; }
#projects { width: min(440px, 38vw); border-color: transparent; background: var(--canvas); font-size: 14px; font-weight: 600; }
#revision { color: var(--muted); font: 11px/1.4 var(--mono); white-space: nowrap; }
.header-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.guide-link { font-size:13px; white-space:nowrap; }
.project-menu { position: relative; }
.project-menu summary { cursor: pointer; font-size: 13px; white-space: nowrap; padding: 8px 0; }
.project-menu > div { position: absolute; right: 0; top: 40px; width: 255px; max-height: calc(100dvh - 90px); overflow: auto; border: 1px solid #b5bbb1; background: #fff; padding: 7px; color: var(--ink); z-index: 30; }
.project-menu button, .project-menu .button { justify-content: start; width: 100%; border: 0; border-radius: 0; padding: 9px 10px; min-height: 36px; margin: 0; }
.project-menu hr { margin: 7px 0; }
.example-menu summary { color: var(--muted); padding: 9px 10px; }
.example-menu button { font-size: 13px; }
.nav-toggle { display: none; }
.shell { display: grid; grid-template-columns: 176px minmax(0, 1fr); align-items: start; min-height: calc(100dvh - 64px); }
.study-navigation { position: sticky; top: 64px; height: calc(100dvh - 64px); overflow-y: auto; background: var(--graphite); color: #edf0e9; padding: 14px 10px 22px; scrollbar-width: thin; scrollbar-color: #636a60 var(--graphite); }
.app-nav { display: flex; flex-direction: column; gap: 2px; }
.app-nav button { display: flex; justify-content: start; gap: 9px; border: 0; border-left: 2px solid transparent; border-radius: 2px; background: transparent; width: 100%; min-height: 35px; padding: 8px 10px; color: #e0e5dc; font-size: 13px; line-height: 1.3; }
.app-nav button:hover { background: #343c35; color: #fff; }
.app-nav button.active { border-left-color: #d98c5a; background: #493b30; color: #fff; font-weight: 600; }
.nav-icon, .app-nav button img { display: inline-flex; width: 16px; height: 16px; flex: 0 0 16px; opacity: .85; }
.nav-icon svg { width: 16px; height: 16px; }
.nav-group { margin: 21px 10px 5px; font-size: 10px; line-height: 1.4; letter-spacing: .08em; text-transform: uppercase; color: #a3afa0; font-weight: 600; }
.app-nav small { color: #b3bcac; font-size: 12px; padding: 10px; }
.scope-menu { margin: 22px 7px 0; padding-top: 16px; border-top: 1px solid #495145; font-size: 12px; }
.scope-menu summary { cursor: pointer; line-height: 1.6; }
.scope { padding: 14px 0 0; }
.scope .section-head { margin-bottom: 12px; flex-wrap: wrap; }
.scope h2 { font-size: 13px; }
.scope .section-head button { padding: 4px 7px; font-size: 11px; min-height: 28px; }
.scope-all, #tree button { width: 100%; justify-content: start; border: 0; border-radius: 0; padding: 8px 7px; background: transparent; color: #e0e5dc; overflow-wrap: anywhere; font-size: 12px; }
.scope-all.active, #tree button.active { background: #493b30; color: #fff; }
#tree ul { padding-left: 12px; list-style: none; margin: 0; }
#tree > ul { padding-left: 0; }
.scope-note { border-top: 1px solid #495145; margin-top: 16px; padding-top: 12px; font-size: 12px; color: #b5bfaf; }
.scope-note button { margin-top: 10px; font-size: 12px; }
main { min-width: 0; padding: 28px 32px 0; background: var(--canvas); }
#workspace { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(330px, .85fr); min-height: calc(100dvh - 143px); max-width: 1680px; margin: 0 auto; background: #fff; border: 1px solid var(--line); }
#workspace.wide, #workspace.board-workspace { display: block; }
#content { min-width: 0; padding: 26px; }
#inspector { min-width: 0; padding: 26px 24px; border-left: 1px solid var(--line); }
#inspector:empty { display: none; }
#inspector p { overflow-wrap: anywhere; }
footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; max-width: 1680px; margin: 0 auto; padding: 14px 0; font-size: 11px; color: var(--muted); }
#notice { background: #fff2d5; color: #725317; padding: 0 24px; font-size: 13px; }
#notice:not(:empty) { padding: 10px 24px; border-bottom: 1px solid #e5cf9c; }
#studyProvenance { background: #f4f0e6; color: #67542b; padding: 7px 24px; border-bottom: 1px solid #dfd6c3; font-size: 12px; }

.browser-status { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 24px; border-bottom:1px solid var(--line); background:#f0f2eb; color:var(--muted); font-size:12px; }
.browser-status > div { display:flex; flex-wrap:wrap; gap:8px; }
.browser-status.attention { background:#fff2d5; color:#725317; }
.browser-status button { font-size:12px; }
@media(max-width:760px) { .browser-status { flex-wrap:wrap; padding-inline:16px; } }

/* Obligation board: hazard context, trace, then a concrete next action. */
#workspace.board-workspace { border: 0; background: transparent; }
.board-workspace > #content { padding: 0; }
#workspace.board-workspace.dock-open { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
.work-heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin: 0 0 24px; }
.work-heading .metadata, .work-heading .muted { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
.work-heading .buttons { justify-content: end; flex-shrink: 0; }
.hazard-switcher { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.dock-open .hazard-switcher { display: none; }
.hazard-choice { display: flex; flex-direction: column; align-items: start; justify-content: start; gap: 6px; min-width: 0; min-height: 76px; padding: 11px 14px; border-color: var(--line); background: #fff; }
.hazard-choice.active { border-color: var(--copper); background: #fffaf6; box-shadow: inset 0 0 0 1px var(--copper); }
.hazard-choice .record-id, .hazard-choice > span:first-child { font: 11px/1.4 var(--mono); color: var(--muted); }
.hazard-choice.active .record-id, .hazard-choice.active > span:first-child { color: var(--copper); }
.hazard-choice strong { font-size: 15px; line-height: 1.35; font-weight: 600; }
.hazard-choice small { color: var(--muted); font-size: 12px; }
.hazard-banner { padding: 16px 20px; background: #fff; border: 1px solid var(--line); border-bottom: 0; }
.hazard-banner .hazard-title, .hazard-banner > .section-head { display: flex; align-items: baseline; gap: 12px; }
.hazard-banner h1, .hazard-banner h2 { font-size: 21px; line-height: 1.3; }
.hazard-banner .eyebrow { margin-bottom: 4px; }
.hazard-banner .section-head { align-items: start; gap: 16px; }
.hazard-banner .buttons { flex-shrink: 0; justify-content: end; gap: 6px; }
.hazard-banner .buttons button { font-size: 12px; padding: 6px 9px; min-height: 32px; }
.hazard-banner .hazard-boundary { font-size: 13px; color: var(--muted); margin: 9px 0 0; line-height: 1.4; }
.hazard-banner .record-id { font: 13px/1.5 var(--mono); color: var(--ink); }
.hazard-banner p { max-width: 85ch; font-size: 14px; }
.hazard-banner .hazard-meta, .hazard-banner .boundary { color: var(--muted); font-size: 13px; }
.risk-strip { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 12px; padding-top: 0; }
.risk-strip > div, .risk-strip > span { min-width: 68px; }
.risk-strip dt, .risk-strip small, .risk-strip .label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.risk-strip dd { margin: 0; font-size: 13px; }
.risk-strip strong { font-weight: 600; }
.board-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #fff; border: 1px solid var(--line); border-top: 0; padding: 0 20px; }
.board-tabs { display: flex; gap: 22px; align-self: stretch; }
.board-tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 0; min-height: 42px; background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap; }
.board-tabs button.active { border-bottom-color: var(--copper); color: var(--copper); font-weight: 600; }
.board-toolbar input { max-width: 220px; padding: 6px 10px; font-size: 13px; }
.obligation-board { background: #fff; border: 1px solid var(--line); border-top: 0; }
.obligation-labels, .obligation-row { display: grid; grid-template-columns: minmax(0, 42fr) minmax(0, 34fr) minmax(0, 24fr); }
.obligation-labels { padding: 11px 24px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; background: #f0f2eb; border-bottom: 1px solid var(--line); }
.obligation-row { position: relative; padding: 21px 24px; border-bottom: 1px solid var(--line); transition: background-color 150ms ease; }
.obligation-row:last-child { border-bottom: 0; }
.obligation-row:hover { background: #fafaf6; }
.obligation-row.selected { background: #fcf4ec; box-shadow: inset 3px 0 var(--copper); }
.obligation-row > div { min-width: 0; padding-right: 24px; }
.obligation-row > div:last-child { padding-right: 0; }
.record-id { font-family: var(--mono); font-size: 11px; letter-spacing: .015em; }
.requirement-cell h3 { font-size: 15px; line-height: 1.45; margin: 6px 0 10px; }
.requirement-cell p, .evidence-cell p { font-size: 14px; margin: 6px 0; }
.control-links { margin-top: 10px; font-size: 13px; }
.control-links > span { display: block; margin-top: 8px; line-height: 1.55; }
.control-links > span > span { display: block; margin-top: 3px; }
.control-links .shared-label { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; }
button.record-title { display: inline; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--ink); font-size: inherit; font-weight: 600; line-height: 1.45; text-align: left; }
button.record-title:hover { color: var(--copper); text-decoration: underline; text-underline-offset: 3px; }
button.text-action { display: inline; min-height: 0; padding: 3px 0; border: 0; border-radius: 0; background: transparent; color: var(--copper); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.scope-note-inline { color: var(--muted); font-size: 13px !important; line-height: 1.5; }
.control-links .link, .control-links a { font-size: 11px; font-family: var(--mono); }
.control-links > div { margin-top: 5px; }
.control-links summary { color: var(--muted); cursor: pointer; font-size: 12px; }
.evidence-cell .link { font-size: 12px; text-align: left; }
.evidence-cell .record-row { padding: 0 0 10px; margin: 0 0 10px; }
.evidence-cell .record-row:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: 0; }
.applicability, .obligation-scope { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
.row-actions { display: flex; align-items: start; flex-direction: column; gap: 10px; }
.row-actions button { font-size: 13px; max-width: 100%; white-space: normal; }
.row-actions .badge { margin-bottom: 2px; }
.dock-open .obligation-labels, .dock-open .obligation-row { grid-template-columns: minmax(0, 56fr) minmax(0, 44fr); }
.dock-open .obligation-labels > :last-child { display: none; }
.dock-open .row-actions { grid-column: 1; flex-direction: row; flex-wrap: wrap; align-items: center; padding-top: 14px; }
.dock-open .hazard-banner .section-head { flex-wrap: wrap; }
.dock-open .hazard-banner .buttons { justify-content: start; }
.dock-open .board-toolbar { flex-wrap: wrap; gap: 0; padding-bottom: 10px; }
.dock-open .board-toolbar input { max-width: none; }
.board-empty { padding: 32px 24px; color: var(--muted); }
.board-count { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--muted); }
.review-actions { margin-top: 28px; }
.review-actions h2 { font-size: 16px; margin-bottom: 6px; }
.next-action { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.next-action p { margin: 4px 0; }
.next-action small { color: var(--muted); }
.next-action > button { flex-shrink: 0; }
#reviewDock { position: sticky; top: 84px; max-height: calc(100dvh - 104px); overflow-y: auto; min-width: 0; border: 1px solid var(--line); background: #fff; scrollbar-width: thin; overscroll-behavior: contain; scroll-margin-top: 84px; }
.review-dock-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 3; background: #fff; padding: 13px 20px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.review-dock-head button { font-size: 12px; min-height: 30px; padding: 5px 9px; }
#reviewDetail { padding: 0; }
#reviewRecordBody { padding: 22px 20px; }
#reviewDetail h2 { font-size: 22px; margin: 6px 0 12px; }
#reviewDetail .inspector-title { font-size: 15px; }
#reviewDock.editing #reviewDetail { display: none; }
#reviewEditorSlot { min-width: 0; }
#editor.docked-editor { position: static; width: 100%; max-width: none; margin: 0; border: 0; box-shadow: none; max-height: none; border-radius: 0; padding: 20px; background: #fff; color: var(--ink); overflow: visible; }
.docked-editor .dialog-head h2 { font-size: 22px; }
.docked-editor .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
.docked-editor input, .docked-editor select, .docked-editor textarea { font-size: 14px; }
.docked-editor .form-actions { position: sticky; bottom: -1px; background: #fff; margin: 22px -20px -20px; padding: 14px 20px; border-top: 1px solid var(--line); z-index: 2; }
#entityForm:has(#draftRecovery) .form-actions > .primary { display:none; }
.board-workspace > #content { animation: board-enter 200ms ease-out both; }
@keyframes board-enter { from { opacity: .65; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Study overview keeps its queue and latest results in reading order. */
.workspace-overview { max-width: 1400px; margin: 0 auto; }
.overview-hero { display: flex; align-items: start; justify-content: space-between; gap: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.overview-hero h1 { max-width: 850px; }
.overview-hero p:not(.eyebrow) { max-width: 90ch; color: var(--muted); }
.overview-hero > button { flex-shrink: 0; }
.study-summary { display: flex; flex-wrap: wrap; gap: 18px 28px; margin-top: 22px; }
.study-summary > div, .study-summary > button { display: flex; align-items: baseline; gap: 7px; }
.study-summary > button { padding: 0; border: 0; min-height: 0; background: transparent; }
.study-summary strong { font-size: 22px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.study-summary span, .study-summary small { color: var(--muted); font-size: 13px; }
.overview-work { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 36px; padding-top: 28px; }
.overview-work > * { min-width: 0; }
.overview-work .section-head { margin-bottom: 10px; }
.overview-work h2 { font-size: 17px; }
.review-queue { border-top: 1px solid var(--line); }
.review-queue-item { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr) 116px 12px; align-items: start; gap: 14px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 18px 0; }
.review-queue-item:hover { background: var(--soft); }
.review-queue-item strong { display: block; font-size: 15px; font-weight: 600; }
.review-queue-item .queue-meta { display: block; font-size: 13px; color: var(--muted); margin-top: 7px; }
.queue-number { color: var(--muted); font: 11px/1.8 var(--mono); padding-top: 2px; }
.queue-risk { display: block; padding-top: 2px; font-size: 13px; text-align: right; white-space: nowrap; }
.queue-risk small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; white-space: normal; }
.review-queue-item > .queue-meta { margin-top: 2px; text-align: right; }
.analysis-summary { border-left: 1px solid var(--line); padding-left: 28px; }
.run-summary { padding: 18px 0; border-bottom: 1px solid var(--line); }
.run-summary:first-of-type { border-top: 1px solid var(--line); }
.run-summary .metrics { margin: 12px 0; border: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.run-summary .metric { padding: 0; }
.run-summary .metric strong { font-size: 21px; }
.run-summary .muted, .analysis-summary > p { font-size: 13px; }
.run-summary dl { display: grid; gap: 14px; margin: 16px 0 0; }
.run-summary dl > div { min-width: 0; }
.run-summary dt { font-size: 13px; color: var(--muted); }
.run-summary dd { margin: 4px 0 0; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.workspace-tools { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px; }
.workspace-tools h3 { margin-bottom: 12px; }
.workspace-tools button { display: block; width: 100%; text-align: left; justify-content: start; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 10px 0; font-size: 13px; }

/* Shared record, worksheet and method vocabulary. */
.section-head, .page-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.page-head { margin-bottom: 24px; }
.page-head p { font-size: 13px; color: var(--muted); }
.view-intro { color: var(--muted); max-width: 95ch; margin: -10px 0 22px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.toolbar input { flex: 1; min-width: 140px; max-width: 440px; }
.toolbar select { width: auto; max-width: 240px; }
.subnav { display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--line); margin: -6px 0 24px; }
.subnav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 11px 0; background: transparent; color: var(--muted); }
.subnav button.active { border-bottom-color: var(--copper); color: var(--copper); font-weight: 600; }
.segmented { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.segmented button { font-size: 13px; padding: 7px 11px; }
.segmented button.active { color: #fff; background: var(--copper); border-color: var(--copper); }
.segmented .add-hazard { margin-left: auto; }
.table-wrap { overflow: auto; max-width: 100%; border-block: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
th, td { padding: 13px 12px; vertical-align: top; line-height: 1.55; border-bottom: 1px solid var(--line); }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: #f1f3ed; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.selected { background: var(--copper-soft); }
td .link { font-size: 12px; }
td .title { display: block; margin-top: 6px; }
td p { margin: 4px 0; }
.hazard-table th, .hazard-table td { padding: 12px 9px; }
.hazard-table td:nth-child(2) { min-width: 140px; }
.hazard-table td:last-child { min-width: 110px; }
.badge { display: inline-block; background: #ecefe8; color: #4f584b; border-radius: 3px; padding: 3px 7px; font-size: 11px; line-height: 1.45; white-space: normal; }
.badge.warn { background: #faedcf; color: #785716; }
.badge.good { background: #e8f0e5; color: #3e6335; }
.inspector-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; margin-bottom: 14px; }
.inspector-head > div { min-width: 0; }
.inspector-head > button { flex-shrink: 0; }
.inspector-head h2 { font-size: 22px; letter-spacing: -.4px; }
.inspector-head #backRecord { font-size: 12px; margin-top: 7px; }
.inspector-title { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 18px; }
.object-revision { font: 11px/1.5 var(--mono); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.detail-section { border-top: 1px solid var(--line); padding: 18px 0; }
.detail-section h3, .detail-section .section-head { margin-bottom: 14px; }
.detail-section .section-head h3 { margin: 0; }
.facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin: 12px 0 18px; }
.facts dt, .risk dt { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.facts dd, .risk dd { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
.risk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin: 0; }
.risk > div + div { border-left: 1px solid var(--line); padding-left: 20px; }
.risk strong { display: block; margin-bottom: 7px; }
.trace-row { border: 1px solid var(--line); border-bottom: 0; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr) 80px 104px; gap: 10px; align-items: start; }
.trace-row:last-child { border-bottom: 1px solid var(--line); }
.trace-row .title { margin: 5px 0; font-size: 13px; line-height: 1.45; }
.trace-row .actions { display: flex; flex-direction: column; gap: 8px; align-items: end; }
.trace-row .actions button { font-size: 12px; padding: 6px 8px; }
.trace-row .requirement-status p { margin: 0; }
.requirement-gap { grid-column: 1 / -1; margin: 0; }
.record-row { padding: 13px 0; border-bottom: 1px solid var(--line); }
.record-row:last-child { border-bottom: 0; }
.record-row .muted { margin-top: 5px; }
.empty { color: var(--muted); padding: 35px 5px; font-size: 13px; }
.pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; gap: 8px; font-size: 12px; color: var(--muted); }
.pagination button { font-size: 12px; padding: 5px 9px; min-height: 30px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid fieldset { border: 0; border-top: 1px solid var(--line); padding: 16px 0 0; margin: 0; grid-column: 1 / -1; min-width: 0; }
.form-grid fieldset legend { font-weight: 600; font-size: 14px; padding: 0 8px 6px 0; }
.form-actions { display: flex; justify-content: end; gap: 8px; margin-top: 24px; border-top: 1px solid var(--line); padding-top: 18px; }
.form-section { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; }
.form-section h3 { grid-column: 1 / -1; margin: 0 0 6px; font-size: 14px; }
.read-only { padding: 9px 0; color: var(--muted); font-size: 13px; }
.settings { max-width: 1080px; }
.settings section { border-top: 1px solid var(--line); padding: 24px 0; }
.settings section:first-of-type { border-top: 0; }
.settings .form-grid { margin-top: 18px; }
.settings h2 { margin-bottom: 12px; }
.settings .table-wrap { margin-top: 16px; }
.settings details { margin-top: 20px; }
.settings summary, .results summary, .fta-layout summary { cursor: pointer; font-weight: 600; }
.settings pre { font-size: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.matrix input { min-width: 120px; padding: 6px; }
.matrix th { min-width: 80px; }
.study-layout { display: grid; grid-template-columns: minmax(340px, 420px) minmax(320px, 1fr); gap: 32px; }
.topology { border: 1px solid var(--line); padding: 16px; margin: 16px 0; background: #fafbf7; }
.topology .node { padding: 10px 0 10px 14px; border-left: 2px solid #bcc4b4; margin-left: 8px; }
.topology .node-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.topology select { width: auto; max-width: 240px; font-size: 13px; padding: 6px; }
.topology button { font-size: 12px; padding: 5px 7px; min-height: 30px; }

function actionState(record, today) {
  const data = record.data || {};
  if (typeof data.completion_evidence === 'string' && data.completion_evidence.trim()) return 'completed';
  const due = data.due || '';

  const validDate = /^\d{4}-\d{2}-\d{2}$/.test(due) && Number.isFinite(Date.parse(due)) && new Date(due).toISOString().slice(0,10) === due;

  if (validDate && due === today) return 'due_today';

}

function sortedActions(records, {today, filter = 'open', owner = '', query = ''} = {}) {

    .filter(r => filter === 'all' || (filter === 'open' ? actionState(r,today) !== 'completed' :

function fieldDifferences(before, after, path = "") {
  if (JSON.stringify(before) === JSON.stringify(after)) return [];
  if (
    before &&
    after &&
    typeof before === "object" &&
    typeof after === "object"
  )
    return [...new Set([...Object.keys(before), ...Object.keys(after)])]
      .filter((k) => k !== "import_lineage")
      .flatMap((k) =>
        fieldDifferences(before[k], after[k], path ? path + "." + k : k),
      );
  return [
    {
      path,
      before: before === undefined ? "(absent)" : JSON.stringify(before),
      after: after === undefined ? "(absent)" : JSON.stringify(after),
    },
  ];
}

function lines(value) {

function matrixGrid(m) {

async function saveSetup(ev) {
  ev.preventDefault();
  try {
    const f = ev.target,
      c = clone(snapshot.project.config);
    for (const k of ["profile", "lifecycle_phase", "configuration", "system_boundary", "governing_basis", "operating_context", "acceptance_process"])
      c[k] = f.elements[k].value;
    c.governing_standards = [...f.querySelectorAll(".standard")].map(
      (el, i) => ({
        ...((typeof c.governing_standards?.[
          Number(el.dataset.originalIndex)
        ] === "object" &&
          c.governing_standards[Number(el.dataset.originalIndex)]) ||
          {}),
        name: el.querySelector("[name=standard_name]").value,
        edition: el.querySelector("[name=standard_edition]").value,
      }),
    );
    if (f.elements.matrix_id.value.trim()) {
      const ss = lines(f.elements.severity_classes.value),
        fs = lines(f.elements.frequency_classes.value);
      const cells = readCells();
      if (
        cells.some((v) => !ss.includes(v.severity) || !fs.includes(v.frequency))
      )
        throw new Error(
          "Update the matrix grid after changing classes before saving.",
        );
      c.risk_matrix = {
        ...(c.risk_matrix || {}),
        id: f.elements.matrix_id.value,
        revision: f.elements.matrix_revision.value,
        source: f.elements.matrix_source.value,
        severity_classes: ss,
        frequency_classes: fs,
        cells,
      };

      throw new Error(
        "Retain the matrix ID, or explicitly migrate criteria in a separate reviewed change.",
      );

      "Project setup saved. Earlier decisions require applicability review.",

function drawReliability() {
  const canvas = $("#reliabilityChart");
  if (!canvas || !currentRun) return;
  const width = Math.max(280, canvas.parentElement.clientWidth),
    height = 200;
  canvas.width = width * 2;
  canvas.height = height * 2;
  canvas.style.width = "100%";
  canvas.style.height = "200px";
  const ctx = canvas.getContext("2d");
  ctx.scale(2, 2);
  ctx.font = "11px system-ui";
  const points = currentRun.curve,
    end = currentRun.basis.config.mission_hours,
    min = Math.max(0, Math.min(...points.map((p) => p.reliability)) - 0.0001),
    range = 1 - min || 1;
  ctx.fillStyle = "#5d707e";
  ctx.strokeStyle = "#dce5ea";
  for (let i = 0; i <= 4; i++) {
    const y = 18 + i * 35;
    ctx.beginPath();
    ctx.moveTo(65, y);
    ctx.lineTo(width - 15, y);
    ctx.stroke();
    ctx.fillText((100 * (1 - (i * range) / 4)).toFixed(3) + "%", 0, y + 4);
  }
  ctx.fillText("0 h", 65, 180);
  ctx.fillText(end + " h", width - 65, 180);
  ctx.fillText("Reliability · expanded vertical scale", 65, 198);
  ctx.strokeStyle = "#08677c";
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = 65 + (end ? p.hours / end : 0) * (width - 80),
      y = 18 + ((1 - p.reliability) / range) * 140;
    if (i) ctx.lineTo(x, y);
    else ctx.moveTo(x, y);
  });
  ctx.stroke();
}

function linkInput(gate) {

    (e) =>
      e.state !== "archived" &&
      ["fault_event", "fault_gate"].includes(e.kind) &&
      e.id !== gate &&
      !snapshot.links.some(
        (l) =>
          l.source === e.id && l.target === gate && l.relation === "input_to",
      ),
  );
  action(
    `Input to ${gate}`,
    `<label>Existing event or gate<select name="input">${inputs.map((e) => option(e.id, `${e.id} · ${e.title}`)).join("")}</select></label>${field("rationale", "Logic rationale", "", "area", [], true)}`,
    async (f) => {

          relation: "input_to",
          target: gate,
          rationale: f.elements.rationale.value,
        },
      });

    },
  );

  writeRoute();
  const drawing = await api(`${url("/api/run-diagram")}&run=${encodeURIComponent(wanted)}`);
  if (view !== "ram" || currentRun?.id !== wanted || ramEditing || !$("#rbdDiagram")) return;
  diagramSVG = drawing.svg; diagramName = "rbd-" + wanted;
  mountDiagram("#rbdDiagram", drawing.svg);
}
function writeRoute() {
  if (!snapshot || restoringRoute) return;
  const params = new URLSearchParams({view});
  if (selected) params.set("record", selected);
  if (view === "hazards" && reviewFocus) params.set("focus", reviewFocus);
  if (view === "studies") { params.set("method", method); if (method === "bowtie") params.set("hazard", bowtieHazard); }
  if (view === "ram" && currentRun) params.set("run", currentRun.id);
  if (scope && !["overview", "ram", "review"].includes(view)) params.set("scope", scope);
  if (["system","requirements"].includes(view)) params.set("kind", kind);
  if (view === "evidence") { params.set("kind", kind); params.set("tab", evidenceView); }
  if (view === "review") { params.set("tab",reviewTab); if (reviewTarget) params.set("focus",reviewTarget); }
  if (view === "actions") { params.set("filter",actionFilter); if (actionOwner) params.set("owner",actionOwner); }
  const hash = "#" + params;
  if (location.hash !== hash) history[location.hash ? "pushState" : "replaceState"](null, "", hash);
}
async function readRoute() {
  const p = new URLSearchParams(location.hash.slice(1));
  view = ["overview", "hazards", "studies", "ram", "evidence", "actions", "review", "baselines", "setup", "practice", "system", "requirements"].includes(p.get("view")) ? p.get("view") : "overview";
  selected = p.get("record") || ""; scope = p.get("scope") || "";
  reviewFocus = view === "hazards" ? p.get("focus") || "" : "";
  reviewTab = ["technical","trace","decisions"].includes(p.get("tab")) ? p.get("tab") : "technical"; reviewTarget = p.get("focus") || ""; reviewCategory = "";
  kind = p.get("kind") || "requirement";
  evidenceView = p.get("tab") === "records" ? "records" : "coverage";
  method = ["hazop", "fmeca", "bowtie", "fta"].includes(p.get("method")) ? p.get("method") : "hazop";
  bowtieHazard = p.get("hazard") || (byId(selected)?.kind === "hazard" ? selected : "");
  ramEditing = false; query = ""; filter = "all"; page = 0;
  actionFilter = ["all","open","overdue","unassigned","completed"].includes(p.get("filter")) ? p.get("filter") : "open"; actionOwner = p.get("owner") || "";
  currentRun = null;
  if (view === "ram" && p.get("run") && studyRecords.runs.some(r => r.id === p.get("run") && r.method !== "static_fta")) currentRun = await api(`${url("/api/record")}&kind=runs&id=${encodeURIComponent(p.get("run"))}`);
}
window.addEventListener("popstate", async () => {
  if (location.hash === "#main") return;
  if (!snapshot) return;
  if (editorDocked && $('#editor').open) { writeRoute(); notice('Save or cancel the current edit before switching records.'); return; }
  restoringRoute = true;
  try { await readRoute(); renderTree(); render(); } catch (error) { notice(error.message); }
  finally { restoringRoute = false; }
});

function hazardsForRun(run) {
  const ids = new Set(components(run.basis?.config.tree || run.config.tree).map(n => n.item));
  return activeRecords("hazard").filter(h => outgoing(h.id, "applies_to").some(e => ids.has(e.id)));
}

function renderCoverage() {
  const all = snapshot.requirement_coverage || [];
  const ids = scoped();
  const scopedRows = all.filter(r => ids.has(r.requirement) && `${r.requirement} ${byId(r.requirement)?.title}`.toLowerCase().includes(query.toLowerCase()));
  const rows = scopedRows.filter(r => coverageFilter !== 'gaps' || r.status !== 'covered' || r.incomplete.length);
  const gaps = scopedRows.filter(r => r.status !== 'covered' || r.incomplete.length).length;
  $('#content').innerHTML = evidenceTabs() + head('Verification coverage', '<button class="primary" data-add="requirement">Add requirement</button>') +
    `<p class="view-intro">Check every requirement against its current revision, operating mode and configuration. Passing declarations still need an evidence adequacy review.</p>${searchBar()}<div class="segmented"><button data-coverage-filter="all" class="${coverageFilter === 'all' ? 'active' : ''}">All coverage items ${scopedRows.length}</button><button data-coverage-filter="gaps" class="${coverageFilter === 'gaps' ? 'active' : ''}">Needs review ${gaps}</button></div>` +
    table(['Requirement / revision', 'Obligation', 'Declaration coverage', 'Next step'], rows.map(r => {
      const req = byId(r.requirement), o = r.obligation;
      return row([`${link(req.id)}<p>${esc(req.title)}</p><span class="muted">Revision ${r.revision}</span>`, o ? `<strong>${esc(o.id)}</strong><p>${esc(o.mode)} · ${esc(o.configuration)}</p>` : '<span class="muted">No explicit obligations</span>',
        `${badge(r.status === 'covered' ? 'Passing declaration' : r.status === 'legacy_declaration' ? 'Define obligations' : 'Missing declaration', r.status === 'covered' ? 'good' : 'warn')}<p>${r.verifications.map(link).join(' · ') || 'No verification linked'}</p>${r.incomplete.length ? '<p class="error">Incomplete or non-passing declarations remain.</p>' : ''}`,
        o ? `<button data-related="verification" data-target="${esc(req.id)}" data-relation="verifies" data-obligation="${esc(o.id)}">Add verification</button>` : `<button data-edit="${esc(req.id)}">Define obligations</button>`]);
    })) + (!all.length ? '<p class="empty">Add a requirement, then define its verification obligations for each mode and configuration.</p>' : '');
}
function renderActions() {
  const today = localDay(), records = activeRecords('action');
  const items = sortedActions(records,{today,filter:actionFilter,owner:actionOwner,query});
  const p = paginate(items), owners = [...new Set(records.map(r=>r.data.owner).filter(Boolean))].sort();
  $('#content').innerHTML = head('Action register', '<button class="primary" data-add="action">Add action</button>') +
    `<p class="view-intro">Assign the work, follow its engineering links, and retain the evidence of completion.</p><div class="segmented action-filters">${[['open','Open'],['overdue','Overdue'],['unassigned','Unassigned'],['completed','Completed'],['all','All']].map(([key,label])=>`<button data-action-filter="${key}" class="${actionFilter === key ? 'active' : ''}">${label} ${sortedActions(records,{today,filter:key}).length}</button>`).join('')}</div>` +
    searchBar(`<label class="owner-filter">Owner<select id="actionOwner">${option('', 'All owners', actionOwner)}${owners.map(o=>option(o,o,actionOwner)).join('')}</select></label>`) +
    table(['Action / linked records', 'Owner', 'Due', 'Status', 'Next step'], p.items.map(a => {
      const status = actionState(a,today);
      return row([`${link(a.id)}<p>${esc(a.title)}</p><span class="action-links">${outgoing(a.id,'addresses').map(e=>link(e.id)).join(' · ') || 'No linked record'}</span>`, esc(a.data.owner || 'Unassigned'), esc(a.data.due || 'Unscheduled'), badge(status,status === 'overdue' ? 'warn' : status === 'completed' ? 'good' : ''), `<div class="buttons"><button data-edit="${esc(a.id)}">Edit</button>${status !== 'completed' ? `<button data-complete-action="${esc(a.id)}">Record completion</button>` : ''}</div>${status === 'completed' ? `<details><summary>Completion evidence</summary><p>${esc(a.data.completion_evidence)}</p></details>` : ''}`]);
    })) + p.html;
}
function completeAction(id) {
  const basis = snapshot.project.revision, record = clone(byId(id));
  action('Record action completion', `<p><strong>${esc(id)}</strong> · ${esc(record.title)}</p>${field('evidence','Completion evidence / controlled reference','','area',[],true)}<p class="muted">This records completion evidence. It does not approve a hazard decision or close verification obligations.</p>`, async f => {
    record.data.completion_evidence = f.elements.evidence.value.trim();
    if (!record.data.completion_evidence) throw new Error('Enter completion evidence or a controlled reference.');
    delete record.revision;
    await mutate({entity:record},basis);
    notice(`Completion recorded for ${id}.`);
  }, 'Record completion');
}
async function reconcileDraft() {
  const latest = await api(`/api/project?project=${encodeURIComponent(snapshot.project.id)}`);
  const remote = latest.entities.find(e=>e.id === pendingDraft.id);
  if (editingIsNew) {
    if (remote) throw new Error('This ID now exists. Keep your draft and choose another stable ID.');
    editorRevision = latest.project.revision;
    $('#entityError').textContent = 'Latest revision checked. Your new record can now be saved; the server will recheck all relationships.';
    $('#draftRecovery').remove();
    return;
  }
  if (!remote) throw new Error('The record no longer exists. Download your draft before leaving this editor.');
  conflictContext = {latest, remote};
  const result = mergeDraft(editing,pendingDraft,remote);
  const display = value => value === undefined ? '(removed)' : typeof value === 'object' ? JSON.stringify(value,null,2) : String(value);
  $('#conflictFields').innerHTML = `<h3>Latest project revision ${latest.project.revision}</h3><p>Changes to different fields are combined. For each conflicting field, choose which value to save.</p>${result.conflicts.map((c,i)=>`<fieldset><legend>${esc(c.path.join(' / '))}</legend><div class="conflict-values"><div><strong>Your draft</strong><pre>${esc(display(c.local))}</pre></div><div><strong>Latest saved</strong><pre>${esc(display(c.remote))}</pre></div></div><label>Value to keep<select data-conflict-index="${i}"><option value="">Choose a value</option><option value="local">Your draft</option><option value="remote">Latest saved</option></select></label></fieldset>`).join('') || '<p>No conflicting fields. Your edits can be combined with the latest saved changes.</p>'}<button type="button" id="saveReconciled" class="primary">Save combined record</button>`;
}
async function saveReconciled() {
  if (!conflictContext) return;
  const {latest,remote} = conflictContext;
  const result = mergeDraft(editing,pendingDraft,remote), choices = {};
  for (const [i,c] of result.conflicts.entries()) {
    const choice = $(`[data-conflict-index="${i}"]`).value;
    if (!choice) { $('#entityError').textContent = 'Choose a value for every conflicting field.'; return; }
    choices[c.key] = choice;
  }
  const merged = mergeDraft(editing,pendingDraft,remote,choices).merged;
  delete merged.revision;
  const button = $('#saveReconciled'); button.disabled = true;
  try {
    await mutate({entity:merged},latest.project.revision);
    selectSavedRecord(merged); draftDirty = false; $('#editor').close(); render(); notice(`Reconciled and saved ${merged.id}.`);
  } catch (error) {
    $('#entityError').textContent = error.message + ' Compare again to include any newer changes.';
  } finally { button.disabled = false; }
}
